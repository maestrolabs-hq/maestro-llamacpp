# The models this router serves.
#
# Every location is relative to a models root supplied at run time, so this
# file describes a set of models without naming the machine they sit on.
#
# The flags tables carry llama-server settings verbatim. This router does not
# interpret them, which is what keeps a change to that server's flag surface
# an edit here rather than a change to the code.
#
# The flag spellings below were verified by hand against llama-server
# 0.3.0-dev (build 1, commit 77f132c). That surface moves between releases, so
# the claim is only true against a version and an unpinned one rots silently.
#
# The dedicated-endpoint relay was verified by hand against that same version:
# a streamed reply arrived in 198 separate pieces spread over 554 milliseconds,
# a reply carried the identifier its endpoint named rather than the disagreeing
# one its request body asked for, and abandoning a stream freed the server's
# slot within 38 milliseconds.
#
# The memory estimates are estimates. Nothing reads them until eviction
# arrives, and measuring them belongs with the slice that has to make a
# decision from them.

version = 1

# Settings every entry shares. An entry inherits what it does not set, and
# overrides it by saying so.
#
# The startup budget is how long an entry may take to become ready before the
# router gives up on it. It sits here rather than in the code because startup
# time varies by two orders of magnitude across these entries, so an entry
# that loads quickly can carry a tighter one of its own.
[defaults]
context_size = 32768
residency = "on-demand"
memory_estimate_mib = 4096
startup_timeout_seconds = 300

[defaults.flags]
jinja = "true"
n-gpu-layers = "999"
fit = "on"
fit-target = "1536"

# The general-purpose model, with a speculative draft and a vision projector.
[models.qwen38]
path = "llm/qwen/qwen3.8-27b/Qwen3.8-27B-UD-Q6_K.gguf"
draft_path = "llm/qwen/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
projector_path = "llm/qwen/qwen3.8-27b/mmproj-F16.gguf"
context_size = 131072
memory_estimate_mib = 24576
reasoning_format = "deepseek"

[models.qwen38.flags]
ctk = "q8_0"
ctv = "q8_0"
fa = "on"
np = "1"
kv-unified = "true"
n-gpu-layers-draft = "999"
spec-type = "draft-mtp"
spec-draft-n-max = "3"

# The same weights at a lower reasoning effort, for extraction work where the
# thinking costs more than it returns.
[models.qwen38-semantic]
path = "llm/qwen/qwen3.8-27b/Qwen3.8-27B-UD-Q6_K.gguf"
draft_path = "llm/qwen/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
projector_path = "llm/qwen/qwen3.8-27b/mmproj-F16.gguf"
context_size = 131072
memory_estimate_mib = 24576
reasoning_format = "deepseek"
reasoning_effort = "low"

[models.qwen38-semantic.flags]
ctk = "q8_0"
ctv = "q8_0"
fa = "on"
np = "1"
kv-unified = "true"
n-gpu-layers-draft = "999"
spec-type = "draft-mtp"
spec-draft-n-max = "3"

# A small model kept for cheap work that does not deserve the large one.
#
# The location is the download cache laid out by the tool that fetched it,
# hash and all, rather than a tidier path someone would have to maintain by
# hand. It is what `models.ini` points at today.
[models.gemma3]
path = ".cache/llama.cpp/models--ggml-org--gemma-3-1b-it-GGUF/snapshots/f9c28bcd85737ffc5aef028638d3341d49869c27/gemma-3-1b-it-Q4_K_M.gguf"
memory_estimate_mib = 2048
startup_timeout_seconds = 60

[models.gemma3.flags]
fa = "on"
np = "1"
kv-unified = "true"

# The resident entry. Held loaded so a caller that asks constantly never waits
# for a load, which is the whole reason residency exists.
[models.qwen3-06b]
path = "llm/qwen/qwen3-0.6b/Qwen3-0.6B-Q8_0.gguf"
residency = "resident"
memory_estimate_mib = 1024

[models.qwen3-06b.flags]
fa = "on"
np = "1"
kv-unified = "true"
